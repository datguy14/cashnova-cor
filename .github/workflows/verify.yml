name: Protocol Verification Engine

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Execute Canonical Protocol Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Multi-Process Invariant Suite
        run: |
          rm -f db/*.sqlite*
          node tests/verify_protocol.js

      - name: Verify Diligence Integrity
        run: |
          sha256sum -c cashnova-diligence/CHECKSUMS.sha256
